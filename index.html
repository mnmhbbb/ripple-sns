<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ripple-sns</title>
    <meta property="og:title" content="ripple sns" />
    <meta property="og:description" content="물결처럼 흘러가는 SNS 프로젝트" />
    <meta property="og:img" content="/thumbnail.png" />
    <script>
      try {
        const themeStore = localStorage.getItem("ThemeStore")
          ? JSON.parse(localStorage.getItem("ThemeStore"))
          : null;
        const theme = themeStore.state.theme;

        const htmlTag = document.documentElement;
        htmlTag.classList.remove("dark", "light");

        if (theme === "system") {
          const isDarkTheme = window.matchMedia(
            "(prefers-color-scheme: dark",
          ).matches;
          htmlTag.classList.add(isDarkTheme ? "dark" : "light");
        }

        htmlTag.classList.add(theme);
      } catch (error) {
        console.error(error);
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <div id="modal-root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
